name: Check NixOS Configuration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: Flake Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Заменили установщик на DeterminateSystems (без упоминания cachix)
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      
      # Добавляем бесплатный кэш, чтобы сборка не длилась вечность
      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Check flake
        run: nix flake check --show-trace
      
      - name: Build system configuration
        run: |
          nix build .#nixosConfigurations.hfv5.config.system.build.toplevel \
            --show-trace \
            --print-build-logs
      
      - name: Check formatting
        run: nix fmt -- --check .
        continue-on-error: true

  build-all-hosts:
    name: Build All Hosts
    runs-on: ubuntu-latest
    needs: check
    
    strategy:
      matrix:
        host: [hfv5]
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      
      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
      
      - name: Build ${{ matrix.host }}
        run: |
          nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel \
            --show-trace \
            --print-build-logs

  update-flake:
    name: Check Flake Updates
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16
      
      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8
      
      - name: Update flake
        run: nix flake update
      
      - name: Check if updates work
        run: nix flake check
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update flake inputs"
          title: "Update flake inputs"
          body: |
            Automated flake update.
            
            Please review the changes and test before merging.
          branch: update-flake
          delete-branch: true