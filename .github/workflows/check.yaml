name: check-config

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nixos-config-cache-hfv5
          authToken: '${{ secrets.AUTH_CACHIX_KEY }}'

      - name: Check flake
        run: nix flake check --show-trace --accept-flake-config

      - name: Build NixOS System
        run: |
          nix build .#nixosConfigurations.nixos.config.system.build.toplevel \
            --show-trace \
            --print-build-logs \
            --accept-flake-config

      - name: Check formatting
        run: nix fmt --accept-flake-config -- --check .
        continue-on-error: true

  update-flake:
    name: Check Flake Updates
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v30
      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: nixos-config-cache-hfv5
          authToken: '${{ secrets.AUTH_CACHIX_KEY }}'
      - name: Update flake
        run: nix flake update
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update flake inputs"
          title: "Update flake inputs"
          branch: update-flake
